<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>oYmer Viewer - walk the BIM model</title>
  <!-- The Dir El Asad corridor: rendered from the BIM by our own engine (path traced, 732 views), trained into
       a Gaussian splat, shipped as SPZ (same picture as the PLY, 30 MB instead of 276 MB - measured 2026-11-06). -->
  <style>
    :root { --accent: #ff7a00; --accent-soft: #ffb066; --bg0: #07070a; --bg1: #140d06; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
      font-family: 'Poppins', system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { touch-action: none; }

    #brand { position: fixed; top: 16px; left: 20px; z-index: 30; font-weight: 700; font-size: 20px;
      letter-spacing: .5px; text-shadow: 0 2px 14px rgba(0,0,0,.6); pointer-events: none; }
    #brand .y { color: var(--accent); }
    #brand .vr { font-weight: 300; font-size: 12px; letter-spacing: 3px; opacity: .75; margin-left: 6px; vertical-align: 2px; }

    #splash { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(1200px 700px at 50% 35%, var(--bg1) 0%, var(--bg0) 60%, #000 100%);
      transition: opacity .8s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .logo-lg { font-weight: 700; font-size: clamp(34px, 8vw, 64px); letter-spacing: 1px; line-height: 1; }
    .logo-lg .y { color: var(--accent); }
    .tagline { font-weight: 300; font-size: clamp(11px, 2.4vw, 14px); letter-spacing: 5px;
      text-transform: uppercase; opacity: .6; margin-top: 10px; }
    .ring { position: relative; width: 56px; height: 56px; }
    .ring::before, .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
    .ring::before { border-top-color: var(--accent); animation: spin 1s linear infinite; }
    .ring::after { border: 3px solid rgba(255,122,0,.18); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-wrap { width: min(320px, 70vw); }
    .pct { text-align: center; font-weight: 600; font-size: 15px; color: var(--accent-soft); margin-bottom: 8px; }
    .bar { height: 6px; background: rgba(255,255,255,.10); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft)); border-radius: 99px; transition: width .25s ease; }
    .stat { text-align: center; font-size: 12.5px; opacity: .6; margin-top: 10px; font-weight: 300; }

    #ready { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .6s ease .3s; }
    #ready.show { opacity: 1; }
    .controls-card { position: fixed; left: 18px; bottom: 18px; background: rgba(10,10,12,.55);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.10); border-radius: 12px;
      padding: 10px 14px; font-size: 13px; font-weight: 300; line-height: 1.7; max-width: calc(100% - 36px); }
    .controls-card b { color: var(--accent); font-weight: 600; }
    .key { display: inline-block; min-width: 18px; text-align: center; padding: 1px 6px; margin: 0 1px;
      background: rgba(255,255,255,.12); border-radius: 5px; font-size: 12px; font-weight: 500; }

    #VRButton { font-family: 'Poppins', system-ui, sans-serif !important; font-weight: 600 !important; letter-spacing: 1px !important;
      background: var(--accent) !important; color: #fff !important; border: none !important; border-radius: 99px !important;
      padding: 0 26px !important; height: 46px !important; line-height: 46px !important; bottom: 20px !important;
      left: auto !important; right: 20px !important; transform: none !important;
      box-shadow: 0 8px 30px rgba(255,122,0,.45) !important; opacity: 1 !important; font-size: 14px !important; }

    #err { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 50; display: none;
      max-width: 80vw; text-align: center; background: rgba(30,8,8,.9); border: 1px solid #a33; border-radius: 12px;
      padding: 18px 22px; font-size: 14px; font-weight: 300; }
    #err b { color: #ff7a00; }
    @media (max-width: 640px) { .controls-card .desk { display: none; } }

    /* after loading, the how-to card opens BIG in the middle and blinks, then shrinks to its corner (bottom left);
       its lines follow one by one, then an orange ring pulses twice */
    .controls-card { border-color: rgba(255,176,102,.55); font-size: 14px; transform-origin: center; }
    #ready.show .controls-card { animation: cardIntro 3.4s cubic-bezier(.3,.7,.2,1) .35s both, cardRing 1.3s ease-out 3.8s 2; }
    #ready.show .controls-card > div { animation: lineIn .45s ease-out both; }
    #ready.show .controls-card > div:nth-child(1) { animation-delay: .6s; }
    #ready.show .controls-card > div:nth-child(2) { animation-delay: .75s; }
    #ready.show .controls-card > div:nth-child(3) { animation-delay: .9s; }
    #ready.show .controls-card > div:nth-child(4) { animation-delay: 1.05s; }
    #ready.show .controls-card > div:nth-child(5) { animation-delay: 1.2s; }
    @keyframes cardIntro {
      0%   { opacity: 0;   transform: translate(calc(50vw - 18px - 50%), calc(18px + 50% - 50vh)) scale(1.2); }
      8%   { opacity: 1;   transform: translate(calc(50vw - 18px - 50%), calc(18px + 50% - 50vh)) scale(1.6); }
      22%  { opacity: .35; } 34% { opacity: 1; } 46% { opacity: .35; } 58% { opacity: 1; }
      72%  { opacity: 1;   transform: translate(calc(50vw - 18px - 50%), calc(18px + 50% - 50vh)) scale(1.6); }
      100% { opacity: 1;   transform: none; }
    }
    @keyframes lineIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes cardRing { from { box-shadow: 0 0 0 0 rgba(255,122,0,.6); } to { box-shadow: 0 0 0 16px rgba(255,122,0,0); } }
    @media (prefers-reduced-motion: reduce) { #ready.show .controls-card, #ready.show .controls-card > div { animation: none; } }

    /* BIM picker card - the clicked element's BIM data */
    #bim { position: fixed; top: 56px; right: 18px; z-index: 25; width: min(320px, calc(100% - 36px));
      background: rgba(10,10,12,.74); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 14px 16px 14px; font-size: 13px; line-height: 1.45; }
    #bim[hidden] { display: none; }
    #bim .cat { color: var(--accent); font-weight: 600; font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; }
    #bim .nm { font-weight: 600; font-size: 16px; margin: 4px 30px 10px 0; word-break: break-word; }
    #bim dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
    #bim dt { opacity: .6; font-weight: 300; }
    #bim dd { margin: 0; font-weight: 500; word-break: break-word; }
    #bim .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.08); color: #fff; font-size: 18px; line-height: 30px; cursor: pointer; }
    #bim .x:hover { background: rgba(255,255,255,.16); }

    /* Tab = the material options: the name shows top centre for a moment */
    #look { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30; pointer-events: none;
      background: rgba(255,122,0,.22); border: 1.5px solid #ffb066; backdrop-filter: blur(6px); border-radius: 99px;
      padding: 6px 18px; font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s ease; }
    #look.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="brand"><span>o</span><span class="y">Y</span><span>mer</span><span class="vr">VIEWER</span></div>

  <div id="splash">
    <div style="text-align:center">
      <div class="logo-lg"><span>o</span><span class="y">Y</span><span>mer</span></div>
      <div class="tagline">Walk the BIM model</div>
    </div>
    <div class="ring"></div>
    <div class="progress-wrap">
      <div class="pct" id="pct">0%</div>
      <div class="bar"><i id="fill"></i></div>
      <div class="stat" id="stat">Loading the scene (30 MB)...</div>
    </div>
  </div>

  <div id="ready">
    <div class="controls-card">
      <div class="desk"><b>Desktop</b> - <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> walk · drag to look</div>
      <div class="touch"><b>Touch</b> - drag to look</div>
      <div><b>BIM</b> - click an object to see its BIM data<span class="desk"> · <span class="key">Tab</span> switch materials</span></div>
      <div><b>Quest 3</b> - <b>Enter VR</b> · right stick moves</div>
      <div class="desk"><b>Exit</b> - <span class="key">Esc</span> leaves full screen</div>
    </div>
  </div>

  <div id="look"></div>

  <div id="bim" hidden>
    <button class="x" aria-label="Close">×</button>
    <div class="cat"></div>
    <div class="nm" dir="auto"></div>
    <dl></dl>
  </div>

  <div id="err"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/addons/": "./libs/three/addons/",
      "@mkkellogg/gaussian-splats-3d": "./libs/gaussian-splats-3d.module.js"
    }
  }
  </script>

  <script type="module">
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    window.addEventListener('error', e => { window.__pageErr = (e.error && e.error.stack) || e.message; });
    window.addEventListener('unhandledrejection', e => { window.__rejErr = (e.reason && e.reason.stack) || String(e.reason); });

    // Original = the night run; wood floor + gold doors = the same night's light with the new material, a fast draft training each
    const SPLATS = { old: 'corridor.spz', wood: 'corridor_wood.spz', gold: 'corridor_gold.spz' };
    const S_KEY = 'old';
    const SPLAT_URL = SPLATS[S_KEY];
    const SPLAT_ROTATION = [0, 1, 0, 0];   // 180 deg about Y: the corridor runs along -Z
    const MOVE_SPEED     = 2.0;            // desktop walk speed (m/sec)
    const VR_SPEED       = 2.0;            // VR stick speed (m/sec)
    const DEADZONE       = 0.15;
    const VR_BOUND       = 24.0;
    // walk only within r of a spot where a camera stood (walk.json) - so the walls stay closed
    let WALK = null, YMIN = -0.1, YMAX = 0.7;
    // the walk area = a tube of radius r along the lines between neighbouring camera stops (no notches between round stops)
    let SEGS = [];
    fetch('walk.json').then(r => r.json()).then(w => {
      WALK = w; YMIN = w.ymin; YMAX = w.ymax;
      const s = w.stops;
      for (let i = 0; i < s.length; i++) { SEGS.push([s[i], s[i]]); for (let j = i + 1; j < s.length; j++) if (Math.hypot(s[i][0] - s[j][0], s[i][1] - s[j][1]) < 1.6) SEGS.push([s[i], s[j]]); }
    }).catch(() => {});
    function nearest(p) {   // the closest point on the tube's centre lines
      let bx = 0, bz = 0, bd = Infinity;
      for (const [a, b] of SEGS) {
        const ex = b[0] - a[0], ez = b[1] - a[1], L = ex * ex + ez * ez;
        const t = L ? Math.max(0, Math.min(1, ((p.x - a[0]) * ex + (p.z - a[1]) * ez) / L)) : 0;
        const qx = a[0] + ex * t, qz = a[1] + ez * t, d = (p.x - qx) ** 2 + (p.z - qz) ** 2;
        if (d < bd) { bd = d; bx = qx; bz = qz; }
      }
      return [bx, bz, Math.sqrt(bd)];
    }
    // a step past the edge is pulled back onto the edge, so you slide along the wall instead of sticking
    function slideIn(p) {
      if (!WALK || !SEGS.length) return;
      const [qx, qz, d] = nearest(p);
      if (d <= WALK.r) return;
      const k = (WALK.r - 0.001) / d;
      p.x = qx + (p.x - qx) * k; p.z = qz + (p.z - qz) * k;
    }

    const splash = document.getElementById('splash'), ready = document.getElementById('ready');
    const pctEl = document.getElementById('pct'), fillEl = document.getElementById('fill');
    const statEl = document.getElementById('stat'), errEl = document.getElementById('err');

    const viewer = new GaussianSplats3D.Viewer({
      cameraUp: [0, 1, 0],
      initialCameraPosition: [0, 0, 0.1],
      initialCameraLookAt: [0, 0, -1],
      webXRMode: GaussianSplats3D.WebXRMode.VR,
      useBuiltInControls: false,
      sharedMemoryForWorkers: false,
      gpuAcceleratedSort: true,
      antialiased: true,
      rootElement: document.getElementById('app')
    });

    viewer.addSplatScene(SPLAT_URL, {
      progressiveLoad: false,
      splatAlphaRemovalThreshold: 25,
      rotation: SPLAT_ROTATION,
      onProgress: (percent) => { const p = Math.max(0, Math.min(100, Math.round(percent || 0))); pctEl.textContent = p + '%'; fillEl.style.width = p + '%'; }
    })
    .then(() => {
      statEl.textContent = 'Ready';
      viewer.start();
      // the library adds its own VR button (webXRMode VR); keep it only where VR works - a PC would show "VR NOT SUPPORTED"
      const dropVR = () => document.querySelectorAll('#VRButton').forEach(b => b.remove());
      if (!navigator.xr) dropVR();
      else navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (!ok) dropVR(); }).catch(dropVR);
      window.__viewer = viewer;
      window.__diag = { loaded: true, splatCount: viewer.splatMesh && viewer.splatMesh.getSplatCount ? viewer.splatMesh.getSplatCount() : 'n/a' };
      const walkStep = setupDesktopWalk(viewer);
      setupVRLocomotion(viewer);
      const picker = setupPicker(viewer);
      setupLooks(viewer);
      // ONE loop for everything: move the camera, then draw the splat, then the outline - same camera, same frame,
      // same canvas, so the outline can never be drawn from another moment than the splat
      viewer.renderer.setAnimationLoop(() => {
        walkStep();
        viewer.update();
        const draw = viewer.shouldRender() || picker.active();
        if (draw) { viewer.render(); if (!viewer.renderer.xr.isPresenting) picker.draw(); }
        viewer.renderNextFrame = false;
      });
      setTimeout(() => splash.classList.add('hide'), 350);
      setTimeout(() => ready.classList.add('show'), 350 + 3000);   // let the scene draw itself in for 3 s, then the how-to card
    })
    .catch((e) => {
      const m = (e && e.message) ? e.message : String(e);
      window.__diag = { loaded: false, error: m };
      splash.classList.add('hide');
      errEl.style.display = 'block';
      errEl.innerHTML = '<b>Could not load the scene.</b><br>' + m;
    });

    // ---------- desktop: W A S D walk, drag to look (no wheel - it would pass the walk limit and steal the page scroll) ----------
    function setupDesktopWalk(viewer) {
      const cam = viewer.camera, keys = {};
      addEventListener('keydown', e => { keys[e.code] = true; });
      addEventListener('keyup',   e => { keys[e.code] = false; });
      addEventListener('blur',    () => { for (const k in keys) keys[k] = false; });

      let yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;
      const canvas = viewer.renderer.domElement;
      canvas.style.cursor = 'grab';
      canvas.addEventListener('pointerdown', e => { window.focus(); dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.style.cursor = 'grabbing'; });
      addEventListener('pointerup',   () => { dragging = false; canvas.style.cursor = 'grab'; });
      addEventListener('pointermove', e => {
        if (!dragging) return;
        yaw   -= (e.clientX - lastX) * 0.0026;
        pitch -= (e.clientY - lastY) * 0.0026;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
        lastX = e.clientX; lastY = e.clientY;
      });

      const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
      const move = new THREE.Vector3(), euler = new THREE.Euler(0, 0, 0, 'YXZ');
      window.__setView = (x, y, z, yw, pt) => { cam.position.set(x, y, z); yaw = yw; pitch = pt || 0; };
      let last = performance.now();
      return function step() {   // called once per frame by the one loop
        const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (!viewer.renderer.xr.isPresenting) {
          euler.set(pitch, yaw, 0, 'YXZ');
          cam.quaternion.setFromEuler(euler);
          fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
          right.crossVectors(fwd, up).normalize();
          move.set(0, 0, 0);
          if (keys['KeyW']) move.add(fwd);
          if (keys['KeyS']) move.sub(fwd);
          if (keys['KeyD']) move.add(right);
          if (keys['KeyA']) move.sub(right);
          if (move.lengthSq() > 0) { move.normalize().multiplyScalar(MOVE_SPEED * dt); cam.position.add(move); slideIn(cam.position); }
          cam.position.y = Math.max(YMIN, Math.min(YMAX, cam.position.y));
        }
      };
    }

    // ---------- BIM picker: the corridor's own BIM elements (pick.bin.gz + pick.json, cut by pickcut.py), never drawn -
    // a click hits that geometry, the triangle names the element, the card shows its BIM data, an outline marks it ----------
    function setupPicker(viewer) {
      const cam = viewer.camera, canvas = viewer.renderer.domElement;
      const card = document.getElementById('bim'), dl = card.querySelector('dl');
      let geo = null, mesh = null, J = null, triEl = null, sel = -1;
      const oscene = new THREE.Scene(); let selObjs = [];

      (async () => {
        const r = await fetch('pick.bin.gz');
        let buf = await r.arrayBuffer(); const b0 = new Uint8Array(buf, 0, 2);
        if (b0[0] === 0x1f && b0[1] === 0x8b)   // still gzip (a server that unzips it on the way is fine too)
          buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
        J = await (await fetch('pick.json')).json();
        const q = new Uint16Array(buf, 0, J.nv * 3), idx = new Uint32Array(buf.slice(J.nv * 6));
        const pos = new Float32Array(J.nv * 3);
        for (let i = 0; i < pos.length; i++) { const k = i % 3; pos[i] = J.min[k] + q[i] / 65535 * (J.max[k] - J.min[k]); }
        geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(new THREE.BufferAttribute(idx, 1));
        geo.computeBoundingSphere();
        mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
        mesh.updateMatrixWorld(true);
        triEl = new Int32Array(J.nt); J.els.forEach((e, i) => triEl.fill(i, e.t0, e.t0 + e.tn));
        // the whole BIM as depth only, so the outline hides behind walls like the real thing
        oscene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide,
          polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 })));
        window.__pick = { els: J.els.length, tris: J.nt };
      })().catch(e => { window.__pickErr = String(e); });

      const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
      function select(i) {
        for (const o of selObjs) { oscene.remove(o); o.geometry.dispose(); } selObjs = [];
        sel = i;
        viewer.forceRenderNextFrame();
        if (i < 0) { card.hidden = true; return; }
        const e = J.els[i];
        const g = new THREE.BufferGeometry(); g.setAttribute('position', geo.attributes.position);
        g.setIndex(new THREE.BufferAttribute(geo.index.array.slice(e.t0 * 3, (e.t0 + e.tn) * 3), 1));
        const fill = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xff7a00, transparent: true, opacity: .22, depthWrite: false, side: THREE.DoubleSide }));
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({ color: 0xffb066 }));
        selObjs = [fill, edges]; oscene.add(fill, edges);
        card.querySelector('.cat').textContent = e.cat || 'Element';
        card.querySelector('.nm').textContent = e.name || '';
        const rows = [];
        if (e.type && e.type !== e.name) rows.push(['Type', e.type]);
        for (const k in e.params) rows.push([k, e.params[k]]);
        rows.push(['Revit ID', e.id]);
        dl.replaceChildren(...rows.flatMap(([k, v]) => { const t = document.createElement('dt'), d = document.createElement('dd'); t.textContent = k; d.textContent = v; d.dir = 'auto'; return [t, d]; }));
        card.hidden = false;
      }
      function hitAt(x, y) {   // which element is under this screen point (-1 = none)
        if (!mesh) return -1;
        const rc = canvas.getBoundingClientRect();
        ndc.set((x - rc.left) / rc.width * 2 - 1, -((y - rc.top) / rc.height) * 2 + 1);
        cam.updateMatrixWorld(); ray.setFromCamera(ndc, cam);
        const hit = ray.intersectObject(mesh, false)[0];
        return hit ? triEl[hit.faceIndex] : -1;
      }
      function pickAt(x, y) { if (mesh) select(hitAt(x, y)); }
      window.__pickAt = (fx, fy) => { pickAt(fx * innerWidth, fy * innerHeight); return sel < 0 ? null : J.els[sel]; };
      // a click = press and release within 6 px (a drag still turns the view)
      let downX = 0, downY = 0;
      canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
      // one click: on the selected element clears it, on another element selects that one, on nothing clears
      canvas.addEventListener('pointerup', e => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) >= 6) return;
        const i = hitAt(e.clientX, e.clientY);
        select(i === sel ? -1 : i);
      });
      card.querySelector('.x').addEventListener('click', () => select(-1));
      addEventListener('keydown', e => { if (e.code === 'Escape') select(-1); });
      // the outline is drawn by the splat's own renderer, right after the splat, onto the same canvas
      function drawOutline() {
        if (sel < 0) return;
        const r = viewer.renderer, ac = r.autoClear;
        r.autoClear = false; r.clearDepth(); r.render(oscene, cam); r.autoClear = ac;
      }
      window.__drawOutline = drawOutline;
      return { active: () => sel >= 0, draw: drawOutline };
    }

    // ---------- Tab: the material options - the same corridor, one splat per option, swapped in place ----------
    function setupLooks(viewer) {
      const LOOKS = [['old', 'Original'], ['wood', 'Wood floor'], ['gold', 'Gold doors']];
      const tag = document.getElementById('look'), blobs = {};
      let i = Math.max(0, LOOKS.findIndex(l => l[0] === S_KEY)), busy = false, hideT = 0;
      const show = (t, stay) => { tag.textContent = t; tag.classList.add('on'); clearTimeout(hideT); if (!stay) hideT = setTimeout(() => tag.classList.remove('on'), 1800); };
      // the other options load quietly in the background (keyboard computers only - a phone has no Tab), so Tab only swaps
      if (matchMedia('(hover: hover)').matches) (async () => { for (const [k] of LOOKS) if (k !== S_KEY) try { blobs[k] = URL.createObjectURL(await (await fetch(SPLATS[k])).blob()); } catch (e) {} })();
      addEventListener('keydown', async e => {
        if (e.code !== 'Tab') return;
        e.preventDefault(); if (busy) return; busy = true;
        i = (i + 1) % LOOKS.length; const [k, name] = LOOKS[i];
        show('Loading ' + name + '...', true);
        try {
          await viewer.removeSplatScene(0, false);
          await viewer.addSplatScene(blobs[k] || SPLATS[k], { format: GaussianSplats3D.SceneFormat.Spz, progressiveLoad: false,
            splatAlphaRemovalThreshold: 25, rotation: SPLAT_ROTATION, showLoadingUI: false });
          show(name + '  ' + (i + 1) + '/' + LOOKS.length);
        } catch (err) { show('Could not load ' + name); window.__lookErr = String(err && err.stack || err); }
        busy = false;
      });
      window.__look = () => LOOKS[i][1];
    }

    // ---------- VR: right stick moves along where you look ----------
    function setupVRLocomotion(viewer) {
      const renderer = viewer.renderer, offset = { x: 0, y: 0, z: 0 };
      let baseSpace = null;
      renderer.xr.addEventListener('sessionstart', () => {
        baseSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();
        let last = 0;
        const loop = (t, frame) => {
          if (!renderer.xr.isPresenting) return;
          const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
          let headYaw = 0;
          const pose = frame.getViewerPose(baseSpace);
          if (pose) { const o = pose.transform.orientation; headYaw = Math.atan2(2 * (o.w * o.y + o.x * o.z), 1 - 2 * (o.y * o.y + o.x * o.x)); }
          let sx = 0, sy = 0;
          for (const src of session.inputSources) {
            if (!src.gamepad || src.handedness !== 'right') continue;
            const ax = src.gamepad.axes;
            sx = ax.length > 2 ? ax[2] : (ax[0] || 0);
            sy = ax.length > 3 ? ax[3] : (ax[1] || 0);
          }
          if (Math.hypot(sx, sy) > DEADZONE) {
            const s = Math.sin(headYaw), c = Math.cos(headYaw);
            offset.x -= (c * sx + s * sy) * VR_SPEED * dt;
            offset.z -= (-s * sx + c * sy) * VR_SPEED * dt;
            offset.x = Math.max(-VR_BOUND, Math.min(VR_BOUND, offset.x));
            offset.z = Math.max(-VR_BOUND, Math.min(VR_BOUND, offset.z));
          }
          renderer.xr.setReferenceSpace(baseSpace.getOffsetReferenceSpace(new XRRigidTransform({ x: offset.x, y: offset.y, z: offset.z })));
          session.requestAnimationFrame(loop);
        };
        session.requestAnimationFrame(loop);
      });
    }

    // opened from the site (?fs=1): go full screen on the first click or key - a browser allows it only after one
    if (/[?&]fs=1/.test(location.search) && document.documentElement.requestFullscreen) {
      const goFull = () => { removeEventListener('pointerdown', goFull, true); removeEventListener('keydown', goFull, true);
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); };
      addEventListener('pointerdown', goFull, true); addEventListener('keydown', goFull, true);
    }

    // touch-only devices: hide the keyboard line, keep the touch line; desktops: hide the touch line
    if (matchMedia('(hover: hover)').matches) document.querySelector('.touch').style.display = 'none';
  </script>
</body>
